spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: personal-website-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  jwt-secret-key: ${JWT_SECRET_KEY:0AKw2vspqu4UBsckwjeYSm20GQ3CLNL5OMpKd3sJt7cZAcBy2N4hN0Tie8NllDBp}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Initial Administrator}
  public-site-url: ${PUBLIC_SITE_URL:http://localhost:5173}
  rate-limit:
    relaxed:
      requests: 60
      window-seconds: 60
    strict:
      requests: 10
      window-seconds: 60
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
    redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/linkedin/callback}
    token-encryption-key: ${LINKEDIN_TOKEN_ENCRYPTION_KEY:}
    api-version: ${LINKEDIN_API_VERSION:202603}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: Bashmobarmeg Academy
    description: Teaching programming
    version: 1.0.1


test:
  name: Ryan Abdulaziz
